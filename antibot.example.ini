# AntiBot — настройки сайта. Скопировать в /etc/antibot/antibot.ini и поправить.
# Права на файл — 600: здесь пароль почты.

[site]
# домен сайта — в письмах и на странице бана
domain = shop.example
# журнал запросов (access log) и его архивы
log = /var/log/nginx/access.log
log_archives = /var/log/nginx/access.log.*
# combined — стандартный формат nginx и Apache; custom — свой (ниже log_regex)
log_format = combined
# log_regex = ^(?P<ip>\S+) \S+ \S+ \[(?P<time>[^\]]+)\] "(?P<method>\S+) (?P<url>\S+)[^"]*" (?P<status>\d{3}) (?P<size>\d+|-) "(?P<referer>[^"]*)" "(?P<ua>[^"]*)"
# time_format = clf          # clf (10/Oct/2026:14:39:01 +0300), iso8601 или epoch
# движок сайта: custom (свой), nextjs, bitrix, opencart, woocommerce
engine = custom
# observe — только «закрыл бы» (сканеров закрывает), enforce — закрывает всех, report — без банов и nginx
mode = observe
# адреса самого сервера — их не закрывать никогда
server_ips =
# контакт на странице бана: почта, ссылка или телефон
contact = support@shop.example

[mail]
to = owner@shop.example
# копия недельной сводки (по желанию)
copy_to =
from =
# smtp или sendmail
method = smtp
smtp_host = smtp.example
smtp_port = 465
# ssl (порт 465) или starttls (порт 587)
smtp_security = ssl
smtp_login =
smtp_password =

[allow]
# белый список: адрес или сеть, по одной в строке, после # — кто это.
# Агрегаторы, которым вы сами отдаёте фид, офис, свои сервисы мониторинга.
addresses =
    198.51.100.10  # офис

[patterns]
# Шаблоны движка — регулярные выражения. Пусто — как в rules.txt. name_extra — добавить к шаблону движка.
# product = ^/product/
# catalog = ^/catalog/
# search = [?&]q=
# js = [?&]ajax=
# own_extra = ^/blog/
# leak_exclude = ^/blog/wp-content/

[thresholds]
# Пороги — как в rules.txt; меняйте здесь, если правило ошибается на ваших посетителях.
# parser_products = 60

[features]
# скачивать раз в сутки опубликованные списки адресов OpenAI и Perplexity
ai_lists = yes
# снимать бан самому, если за адресом явно человек (пришёл из поиска)
auto_unban_humans = yes
# не закрывать адреса Cloudflare (если сайт за Cloudflare без real_ip)
never_ban_cdn = yes

[paths]
state_dir = /var/lib/antibot
nginx_dir = /etc/nginx/antibot
nginx_http_conf = /etc/nginx/conf.d/antibot.conf
nginx_site_conf = /etc/nginx/snippets/antibot-site.conf
nginx_test = nginx -t
nginx_reload = nginx -s reload
nginx_dump = nginx -T
